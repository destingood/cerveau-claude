# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# CERVEAU — golden sets des packs Généraliste et Finance (seuils : config/evals.yaml, D6, D17).
# Cases: core/evals/cases.py loads and validates them; cerveau.py runs each one end to end.
# Offline (make eval): scripted models, every deterministic layer for real, no key, no cost.
# Live (make eval-live CAMPAIGN=<name> SUITES=golden): only for a campaign Lucas agreed to (D8).
description: "CERVEAU — golden sets des packs Généraliste et Finance (seuils : config/evals.yaml, D6, D17)"

prompts:
  - "{{question}}"

providers:
  - id: file://cerveau.py
    label: cerveau
    config:
      workers: 1  # one Python process: spaCy and the configuration load once
      timeout: 300000  # ms; a live case also waits for the judge

tests: file://cerveau.py:golden_tests

defaultTest:
  assert:
    - type: python
      value: file://cerveau.py:get_assert
