[project]
name = "cerveau"
version = "0.0.1"
description = "CERVEAU: personal multi-domain AI platform (Phase 0 foundations)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - personal use" }
authors = [{ name = "Lucas" }]
dependencies = [
    "jsonschema>=4",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
cerveau = "interfaces.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "interfaces"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", # French text legitimately contains non-ASCII punctuation
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108"]
".claude/hooks/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hooks: tests of the Claude Code hooks (.claude/hooks)",
]

[tool.coverage.run]
source = ["core", "interfaces"]
branch = true
