# TEMPORAIRE (diagnostic de test_commun sous Windows) : à retirer avant la fusion.
name: Diag commun
on:
  push:
    branches: [claude/eloquent-lovelace-ds7vsi]
    paths: [".github/workflows/diag-commun.yml", ".github/diag_commun.py", "brain.py", "brainkit/**", "tests/test_commun.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        run: [1, 2]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - shell: bash
        run: uv run --no-project python .github/diag_commun.py
