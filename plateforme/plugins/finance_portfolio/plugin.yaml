# Manifeste du plugin finance_portfolio (Annexe C.1, ADR-015, ADR-018). Un outil de LECTURE sur
# la base finance locale ; seule `cerveau portfolio import` y écrit les transactions.
id: finance_portfolio
version: 0.1.0
domain: finance
kind: tool
transport: mcp-stdio
# Positions, espèces, poids, expositions et rapprochement : la vue portefeuille d'Aladdin, sur
# les transactions importées par Lucas.
parity_label: "[Parité]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: portfolio_snapshot
    description: >-
      Instantané du portefeuille connu à as_of : positions, espèces, poids, expositions par
      secteur, pays et devise, état du rapprochement avec le dernier relevé. Chaque nombre porte
      sa valeur, son affichage et un identifiant.
    action_class: LECTURE
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    input_schema: schemas/portfolio_snapshot.in.json
    output_schema: schemas/portfolio_snapshot.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par Lucas après les premières mesures.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# mcp, pydantic (MIT), pandas (BSD-3-Clause), exchange-calendars (Apache-2.0) : docs/licences.md.
dependencies_licences: [MIT, BSD-3-Clause, Apache-2.0]
# Démarrage (ADR-015, B26) : seul CERVEAU_HOME est transmis, pour trouver la base ; aucun outil
# payant.
runtime:
  module: plugins.finance_portfolio
  env: [CERVEAU_HOME]
  priced_tools: {}
