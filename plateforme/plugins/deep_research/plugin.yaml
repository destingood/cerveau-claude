# Manifeste du plugin deep_research (Annexe C.1, ADR-045, plan de phase 6 §5). La recherche
# approfondie du pack Recherche : un agent in-process sans outil propre. Il appelle les outils de
# lecture du pack (web_research, scholarly) sous la même politique (R2, R5) ; le moteur générique
# est core/research/, les prompts du plan et de la rédaction sont dans prompts/.
id: deep_research
version: 0.1.0
domain: recherche
kind: agent
transport: in-process
# [Reconstruction inspirée de gpt-researcher et de STORM] : planificateur, lectures bornées,
# rédaction ; aucun code repris. Les citations et les chiffres sont vérifiés par le code (D15).
parity_label: "[Reconstruction]"
environments: [dev]
# Une recherche produit un document d'analyse, jamais une action (D3 : le pack entre à N0).
max_autonomy_level: N0
tools: []
agent:
  entrypoint: plugins.deep_research.agent:deep_research
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par l'utilisateur après les premières mesures réelles.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# pydantic (MIT), langchain-core (MIT) : docs/licences.md.
dependencies_licences: [MIT]
