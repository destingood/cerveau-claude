# Manifeste du plugin cyber_cve (Annexe C.1, ADR-055). Deux outils de LECTURE sur trois sources
# publiques à adresse fixe : le NVD, le catalogue KEV de la CISA et l'EPSS de FIRST. Aucun outil
# d'action, aucune entrée d'hôte, d'adresse ou d'URL ; tout texte renvoyé est une donnée externe
# non fiable (R5).
id: cyber_cve
version: 0.1.0
domain: cyber
kind: tool
transport: mcp-stdio
# Champs des sources recopiés tels quels, mais sélection, troncature et tri propres au plugin.
parity_label: "[Approximation]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: cve_lookup
    description: >-
      Lit 1 à 10 CVE (CVE-AAAA-NNNN) : fiche NVD (statut, dates, description tronquée, scores
      CVSS publiés, CWE, SSVC, références), inscription au catalogue KEV de la CISA et score
      EPSS de FIRST, avec la date de lecture de chaque source. Les CVE sont rangées par une
      règle fixe (KEV, puis EPSS, puis CVSS, puis identifiant) rendue avec le résultat.
    action_class: LECTURE
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: true
    input_schema: schemas/cve_lookup.in.json
    output_schema: schemas/cve_lookup.out.json
  - name: cve_watch
    description: >-
      Veille datée : entrées du catalogue KEV ajoutées dans une plage de dates (filtre
      facultatif sur l'éditeur ou le produit), ou CVE publiées au NVD dans une plage de 120
      jours au plus pour un mot-clé ou la liste produits_suivis. 20 résultats au plus, les
      plus récents d'abord ; aucune entrée hors de la plage.
    action_class: LECTURE
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: true
    input_schema: schemas/cve_watch.in.json
    output_schema: schemas/cve_watch.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par l'utilisateur après les premières mesures.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# mcp (MIT), Pydantic (MIT), PyYAML (MIT), httpx (BSD-3-Clause) : docs/licences.md.
dependencies_licences: [MIT, BSD-3-Clause]
# Démarrage (ADR-015). NVD_API_KEY (G3), facultative, part dans l'en-tête apiKey et nulle part
# ailleurs ; CERVEAU_HOME désigne le projet servi (configuration, produits_suivis). Aucun outil
# payant. Limites de débit partagées dans var/net/ (ADR-044), cache de 24 h dans var/cyber/.
# Délai : 10 fiches à 6 s d'écart sans clé, puis le KEV et l'EPSS, tiennent dans 180 s (ADR-055).
runtime:
  module: plugins.cyber_cve
  env: [NVD_API_KEY, CERVEAU_HOME]
  priced_tools: {}
  tool_timeout_s: 180
