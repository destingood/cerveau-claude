# Manifeste du plugin finance_risk (Annexe C.1, ADR-014, ADR-015). Un outil de CALCUL en lecture
# seule sur la base finance locale et sur config/risk.yaml ; rien n'y est écrit.
id: finance_risk
version: 0.1.0
domain: finance
kind: tool
transport: mcp-stdio
# Mesures de risque de marché, stress et décomposition de la VaR (plan F3) : le moteur de risque
# d'Aladdin, approché sans modèle de facteurs (D9) ni indice de référence validé (D8), avec un
# choc de taux en partie estimé et la règle de la racine du temps.
parity_label: "[Approximation]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: risk_report
    description: >-
      Risque de marché du portefeuille connu à as_of : volatilité et GARCH, VaR et CVaR
      historique, paramétrique et Monte Carlo, backtest de Kupiec, drawdown, bêta, corrélations,
      concentration, contributions d'Euler, stress de taux, d'actions, de change, sectoriels et
      historiques, décomposition d'une variation de VaR depuis compare_to. Chaque nombre porte sa
      valeur, son affichage et un identifiant ; une mesure impossible est dite, jamais estimée.
    action_class: CALCUL
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    input_schema: schemas/risk_report.in.json
    output_schema: schemas/risk_report.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par l'utilisateur après les premières mesures.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# mcp, pydantic (MIT), numpy, pandas, scipy (BSD-3-Clause), arch (NCSA),
# exchange-calendars (Apache-2.0) : docs/licences.md.
dependencies_licences: [MIT, BSD-3-Clause, NCSA, Apache-2.0]
# Démarrage (ADR-015, B26) : seul CERVEAU_HOME est transmis, pour trouver la base et config/ ;
# aucun outil payant.
runtime:
  module: plugins.finance_risk
  env: [CERVEAU_HOME]
  priced_tools: {}
