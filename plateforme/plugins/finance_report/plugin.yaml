# Manifeste du plugin finance_report (Annexe C.1, ADR-020, ADR-015). Un outil de CALCUL en lecture
# seule sur la base finance locale et sur config/ ; rien n'y est écrit.
id: finance_report
version: 0.1.0
domain: finance
kind: tool
transport: mcp-stdio
# Mesure de performance et attribution par ligne et par secteur (plan F9) : la fonction de
# performance d'Aladdin. L'attribution de Brinson contre l'indice et le rapport HTML sont reportés
# (plan, F9) ; la comparaison à l'indice attend D8 et l'attribution factorielle D9.
parity_label: "[Parité]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: performance_report
    description: >-
      Performance du portefeuille connu à as_of sur une période : valeurs de début et de fin,
      apports, dividendes et frais, TWR et MWR (annualisés sur au moins un an), volatilité, Sharpe
      et Sortino sur l'€STR, perte maximale avec ses dates, Calmar ; contributions au TWR de chaque
      ligne et de chaque secteur avec le résidu. Comparaison à l'indice et attribution
      factorielle indisponibles tant que l'indice et les facteurs ne sont pas validés. Chaque
      nombre porte sa valeur, son affichage et un identifiant.
    action_class: CALCUL
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    input_schema: schemas/performance_report.in.json
    output_schema: schemas/performance_report.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par l'utilisateur après les premières mesures.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# mcp, pydantic (MIT), numpy, pandas, scipy (BSD-3-Clause), exchange-calendars (Apache-2.0) :
# docs/licences.md.
dependencies_licences: [MIT, BSD-3-Clause, Apache-2.0]
# Démarrage (ADR-015, B26) : seul CERVEAU_HOME est transmis, pour trouver la base et config/ ;
# aucun outil payant.
runtime:
  module: plugins.finance_report
  env: [CERVEAU_HOME]
  priced_tools: {}
