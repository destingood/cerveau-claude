# Manifeste du plugin business_calc (Annexe C.1, ADR-061). Un outil de CALCUL, déterministe et
# local : marges, prix, TVA, seuil de rentabilité, CAC et LTV, croissance. Aucune entrée réseau,
# aucun fichier écrit ; seule l'opération TVA lit config/business.yaml (I7).
id: business_calc
version: 0.1.0
domain: business
kind: tool
transport: mcp-stdio
# Formules usuelles de gestion, sans équivalent Aladdin.
parity_label: "[Approximation]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: biz_calc
    description: >-
      Calcul commercial déterministe, en décimal exact, pour une opération d'une liste fermée :
      marge (marge brute, taux de marge, taux de marque, coefficient), prix_de_vente (depuis un
      coût et une cible), tva (HT vers TTC ou l'inverse, au taux de config/business.yaml),
      seuil_rentabilite (seuil, point mort en jours, marge de sécurité), cac_ltv (CAC, LTV sur
      marge brute, rapport), variation et tcac. Rend les paramètres repris, les résultats avec
      leur affichage, les formules et les arrondis : les citer tels quels, sans recalcul.
    action_class: CALCUL
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    input_schema: schemas/biz_calc.in.json
    output_schema: schemas/biz_calc.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par Lucas après les premières mesures.
  success_rate_min: 0.99
  p95_latency_ms: A_DEFINIR
# mcp (MIT), Pydantic (MIT), PyYAML (MIT) : docs/licences.md.
dependencies_licences: [MIT]
# Démarrage (ADR-015). CERVEAU_HOME désigne le projet servi (configuration). Aucun outil payant,
# aucun réseau ; un calcul tient en quelques millisecondes.
runtime:
  module: plugins.business_calc
  env: [CERVEAU_HOME]
  priced_tools: {}
  tool_timeout_s: 10
