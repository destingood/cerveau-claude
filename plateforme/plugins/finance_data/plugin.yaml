# Manifeste du plugin finance_data (Annexe C.1, ADR-015). Un outil de LECTURE sur la base finance
# locale ; aucun accès réseau : seule `cerveau finance sync` remplit la base.
id: finance_data
version: 0.1.0
domain: finance
kind: tool
transport: mcp-stdio
# Cours de clôture d'un fichier CSV et de la BCE, sans flux temps réel ni fondamentaux (ADR-013) :
# une approximation des données de marché d'Aladdin.
parity_label: "[Approximation]"
environments: [dev]
max_autonomy_level: N1
tools:
  - name: market_data
    description: >-
      Données de marché de la base finance connues à as_of : clôtures des dernières séances
      (cours) ou fiches du référentiel (referentiel), avec score de qualité et fraîcheur.
      Fondamentaux indisponibles (aucun fournisseur). Chaque nombre porte sa valeur, son
      affichage et un identifiant.
    action_class: LECTURE
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    input_schema: schemas/market_data.in.json
    output_schema: schemas/market_data.out.json
tests: tests/
evals:
  questions: evals/questions.xml
  golden: evals/golden.jsonl
slo:
  # Provisoire, à confirmer par Lucas après les premières mesures.
  success_rate_min: 0.9
  p95_latency_ms: A_DEFINIR
# mcp, pydantic (MIT), pandas (BSD-3-Clause), exchange-calendars (Apache-2.0) : docs/licences.md.
dependencies_licences: [MIT, BSD-3-Clause, Apache-2.0]
# Démarrage (ADR-015, B26) : seul CERVEAU_HOME est transmis, pour trouver la base ; aucun outil
# payant.
runtime:
  module: plugins.finance_data
  env: [CERVEAU_HOME]
  priced_tools: {}
