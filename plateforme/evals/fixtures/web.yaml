    title: Le télétravail et le lien social
    published: "2025-03-02"
    text: |
      Un télétravail à temps plein expose à un risque d'isolement professionnel.
      Les entreprises qui alternent jours sur site et jours à distance cherchent à préserver la coopération entre collègues.
    extracts:
