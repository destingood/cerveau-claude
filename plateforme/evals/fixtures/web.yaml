        citation: Un télétravail à temps plein expose à un risque d'isolement professionnel
      - affirmation: Alterner site et distance vise à préserver la coopération.
        citation: Les entreprises qui alternent jours sur site et jours à distance cherchent à préserver la coopération entre collègues

  - url: https://numerique.example/maison/box-internet
    title: La consommation d'une box internet
    published: "2025-01-29"
    text: |
      Une box internet reste allumée en permanence et consomme de l'électricité même lorsque personne ne s'en sert.
      L'éteindre la nuit réduit un peu la facture d'électricité.
    extracts:
