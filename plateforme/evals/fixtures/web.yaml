  - url: https://physique.example/optique/couleur-du-ciel
    title: Pourquoi le ciel est-il bleu ?
    published: "2024-10-10"
    text: |
      La lumière du Soleil contient toutes les couleurs.
      En traversant l'atmosphère, elle est diffusée par les molécules de l'air, et les courtes longueurs d'onde, comme le bleu, sont bien plus diffusées que le rouge : c'est la diffusion de Rayleigh.
    extracts:
      - affirmation: Le bleu est bien plus diffusé que le rouge par les molécules de l'air.
        citation: les courtes longueurs d'onde, comme le bleu, sont bien plus diffusées que le rouge
      - affirmation: Ce phénomène s'appelle la diffusion de Rayleigh.
        citation: c'est la diffusion de Rayleigh

  - url: https://astronomie.example/terre/saisons
    title: D'où viennent les saisons ?
    published: "2024-12-21"
    text: |
      Les saisons s'expliquent par l'inclinaison de l'axe de rotation de la Terre, d'environ 23 degrés, par rapport au plan de son orbite.
      Elles ne viennent pas de la distance au Soleil : la Terre en est même au plus près début janvier, en plein hiver boréal.
    extracts:
      - affirmation: Les saisons viennent de l'inclinaison de l'axe de rotation de la Terre.
        citation: Les saisons s'expliquent par l'inclinaison de l'axe de rotation de la Terre
      - affirmation: Elles ne viennent pas de la distance au Soleil.
        citation: Elles ne viennent pas de la distance au Soleil

  - url: https://sante.example/medicaments/antibiotiques
    title: Les antibiotiques, à quoi servent-ils ?
    published: "2025-11-30"
    text: |
      Les antibiotiques agissent contre les bactéries ; ils sont sans effet sur les virus, comme ceux de la grippe ou du rhume.
      Les prendre sans raison favorise l'apparition de bactéries résistantes.
    extracts:
      - affirmation: Les antibiotiques agissent contre les bactéries mais pas contre les virus.
        citation: Les antibiotiques agissent contre les bactéries ; ils sont sans effet sur les virus
      - affirmation: Les prendre sans raison favorise les résistances.
        citation: Les prendre sans raison favorise l'apparition de bactéries résistantes

