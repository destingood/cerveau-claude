  - url: https://bourse-pedagogie.example/fonds/etf
    title: Qu'est-ce qu'un ETF ?
    published: "2025-09-08"
    text: |
      Un ETF, ou fonds indiciel coté, est un fonds d'investissement qui réplique la performance d'un indice et s'échange en bourse comme une action.
      Ses frais de gestion sont en général plus faibles que ceux d'un fonds géré activement.
      Comme tout placement en actions, il expose à un risque de perte en capital.
    extracts:
      - affirmation: Un ETF est un fonds coté qui réplique la performance d'un indice et s'échange en bourse comme une action.
        citation: Un ETF, ou fonds indiciel coté, est un fonds d'investissement qui réplique la performance d'un indice et s'échange en bourse comme une action
      - affirmation: Ses frais de gestion sont en général plus faibles que ceux d'un fonds géré activement.
        citation: Ses frais de gestion sont en général plus faibles que ceux d'un fonds géré activement
      - affirmation: Un ETF expose à un risque de perte en capital.
        citation: Comme tout placement en actions, il expose à un risque de perte en capital
