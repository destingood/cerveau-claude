  - url: https://encyclopedie.example/wiki/Tour_Eiffel
    title: Tour Eiffel — Encyclopédie libre
    published: "2025-06-02"
    text: |
      La tour Eiffel est une tour de fer puddlé construite par Gustave Eiffel et ses collaborateurs pour l'Exposition universelle de Paris de 1889.
      Sa construction a duré deux ans, deux mois et cinq jours, de 1887 à 1889.
      Haute de 330 mètres avec ses antennes, elle est située sur le Champ-de-Mars, à Paris.
    extracts:
      - affirmation: La tour Eiffel mesure 330 mètres avec ses antennes.
        citation: Haute de 330 mètres avec ses antennes
      - affirmation: Elle a été construite pour l'Exposition universelle de Paris de 1889.
        citation: construite par Gustave Eiffel et ses collaborateurs pour l'Exposition universelle de Paris de 1889

  - url: https://histoire.example/revolution/prise-de-la-bastille
    title: La prise de la Bastille — Histoire de France
    published: "2024-03-11"
    text: |
      La prise de la Bastille a eu lieu à Paris le 14 juillet 1789.
      La forteresse, qui servait de prison d'État, symbolisait l'arbitraire du pouvoir royal.
      L'événement est devenu l'un des symboles de la Révolution française ; le 14 juillet est la fête nationale depuis 1880.
    extracts:
      - affirmation: La prise de la Bastille a eu lieu à Paris le 14 juillet 1789.
        citation: La prise de la Bastille a eu lieu à Paris le 14 juillet 1789
      - affirmation: Le 14 juillet est la fête nationale depuis 1880.
        citation: le 14 juillet est la fête nationale depuis 1880

  - url: https://astronomie.example/systeme-solaire/planetes
    title: Les planètes du Système solaire
    published: "2025-01-20"
    text: |
      Depuis la décision de l'Union astronomique internationale en 2006, le Système solaire compte officiellement huit planètes.
      Il s'agit de Mercure, Vénus, la Terre, Mars, Jupiter, Saturne, Uranus et Neptune.
      Pluton, découverte en 1930, a été reclassée à cette occasion dans la catégorie des planètes naines.
    extracts:
      - affirmation: Le Système solaire compte officiellement huit planètes depuis 2006.
        citation: Depuis la décision de l'Union astronomique internationale en 2006, le Système solaire compte officiellement huit planètes
      - affirmation: Pluton a été reclassée comme planète naine.
        citation: Pluton, découverte en 1930, a été reclassée à cette occasion dans la catégorie des planètes naines

  - url: https://sciences.example/portraits/marie-curie
    title: Marie Curie, physicienne et chimiste
    published: "2023-11-07"
    text: |
      Marie Curie est la première femme à avoir reçu un prix Nobel et la seule personne récompensée dans deux disciplines scientifiques différentes.
      Elle a reçu le prix Nobel de physique en 1903, partagé avec Pierre Curie et Henri Becquerel, puis le prix Nobel de chimie en 1911.
    extracts:
      - affirmation: Marie Curie a reçu deux prix Nobel, en physique (1903) et en chimie (1911).
        citation: Elle a reçu le prix Nobel de physique en 1903, partagé avec Pierre Curie et Henri Becquerel, puis le prix Nobel de chimie en 1911
      - affirmation: Elle est la seule personne récompensée dans deux disciplines scientifiques différentes.
        citation: la seule personne récompensée dans deux disciplines scientifiques différentes

  - url: https://economie.example/monnaie/euro-fiduciaire
    title: L'euro fiduciaire
    published: "2024-09-15"
    text: |
      L'euro a d'abord été une monnaie scripturale, à partir du 1er janvier 1999.
      Les pièces et les billets en euros ont été mis en circulation le 1er janvier 2002 dans douze pays, dont la France.
      Le franc a cessé d'avoir cours légal en France le 17 février 2002.
    extracts:
      - affirmation: Les pièces et billets en euros circulent depuis le 1er janvier 2002.
        citation: Les pièces et les billets en euros ont été mis en circulation le 1er janvier 2002 dans douze pays, dont la France
      - affirmation: Le franc a cessé d'avoir cours légal le 17 février 2002.
        citation: Le franc a cessé d'avoir cours légal en France le 17 février 2002

  - url: https://sante.example/corps-humain/squelette
    title: Le squelette humain
    published: "2025-02-03"
    text: |
      Le squelette d'un adulte compte en général 206 os.
      Celui d'un nouveau-né en compte davantage, car plusieurs os se soudent au cours de la croissance.
      Le fémur, situé dans la cuisse, est l'os le plus long du corps humain.
    extracts:
      - affirmation: Le squelette d'un adulte compte en général 206 os.
        citation: Le squelette d'un adulte compte en général 206 os
      - affirmation: Un nouveau-né a davantage d'os, qui se soudent pendant la croissance.
        citation: Celui d'un nouveau-né en compte davantage, car plusieurs os se soudent au cours de la croissance

  - url: https://physique.example/thermodynamique/ebullition-eau
    title: L'ébullition de l'eau
    published: "2024-05-28"
    text: |
      À la pression atmosphérique normale, soit 1 atmosphère, l'eau pure bout à environ 100 °C.
      En altitude, la pression est plus faible et l'eau bout à une température plus basse.
    extracts:
      - affirmation: À la pression atmosphérique normale, l'eau pure bout à environ 100 °C.
        citation: À la pression atmosphérique normale, soit 1 atmosphère, l'eau pure bout à environ 100 °C
      - affirmation: En altitude, l'eau bout à une température plus basse.
        citation: En altitude, la pression est plus faible et l'eau bout à une température plus basse

  - url: https://physique.example/constantes/vitesse-de-la-lumiere
    title: La vitesse de la lumière dans le vide
    published: "2024-08-19"
    text: |
      La vitesse de la lumière dans le vide est fixée à exactement 299 792 458 mètres par seconde.
      Depuis 1983, cette valeur sert à définir le mètre dans le Système international d'unités.
    extracts:
      - affirmation: La vitesse de la lumière dans le vide vaut exactement 299 792 458 mètres par seconde.
        citation: La vitesse de la lumière dans le vide est fixée à exactement 299 792 458 mètres par seconde
      - affirmation: Depuis 1983, cette valeur sert à définir le mètre.
        citation: Depuis 1983, cette valeur sert à définir le mètre dans le Système international d'unités

  - url: https://droit.example/institutions/constitution-1958
    title: La Constitution du 4 octobre 1958
    published: "2025-04-04"
    text: |
      La Constitution de la Cinquième République a été approuvée par référendum le 28 septembre 1958.
      Elle a été promulguée le 4 octobre 1958, date qui lui donne son nom officiel.
    extracts:
