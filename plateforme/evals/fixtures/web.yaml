  - url: https://travail.example/organisation/teletravail
    title: Télétravail et productivité
    published: "2025-04-18"
    text: |
      Les études sur le télétravail aboutissent à des résultats contrastés : certaines observent une productivité stable ou en hausse, d'autres une baisse.
      Le télétravail supprime les trajets domicile-travail, ce qui libère du temps pour les salariés.
    extracts:
      - affirmation: Les études sur la productivité en télétravail sont contrastées.
        citation: Les études sur le télétravail aboutissent à des résultats contrastés
      - affirmation: Le télétravail supprime les trajets domicile-travail.
        citation: Le télétravail supprime les trajets domicile-travail, ce qui libère du temps pour les salariés

