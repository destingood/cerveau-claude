        citation: Elle a été promulguée le 4 octobre 1958

  - url: https://physique.example/unites/newton
    title: Le newton, unité de force
    published: "2024-02-12"
    text: |
      Le newton, de symbole N, est l'unité de force du Système international d'unités.
      Un newton est la force qui communique à une masse d'un kilogramme une accélération d'un mètre par seconde carrée.
    extracts:
      - affirmation: Le newton est l'unité de force du Système international.
        citation: Le newton, de symbole N, est l'unité de force du Système international d'unités
      - affirmation: Un newton communique à un kilogramme une accélération d'un mètre par seconde carrée.
        citation: Un newton est la force qui communique à une masse d'un kilogramme une accélération d'un mètre par seconde carrée

  - url: https://biologie.example/genetique/double-helice
    title: La découverte de la double hélice de l'ADN
    published: "2023-04-25"
    text: |
      En 1953, James Watson et Francis Crick ont publié un modèle de la structure en double hélice de l'ADN.
      Leurs travaux s'appuyaient notamment sur les clichés de diffraction des rayons X obtenus par Rosalind Franklin.
    extracts:
      - affirmation: Le modèle en double hélice de l'ADN a été publié en 1953 par Watson et Crick.
        citation: En 1953, James Watson et Francis Crick ont publié un modèle de la structure en double hélice de l'ADN
      - affirmation: Ce modèle s'appuyait sur les clichés de diffraction de Rosalind Franklin.
        citation: Leurs travaux s'appuyaient notamment sur les clichés de diffraction des rayons X obtenus par Rosalind Franklin

  - url: https://geographie.example/montagnes/everest
    title: L'Everest, plus haut sommet du monde
    published: "2024-12-08"
    text: |
      En 2020, la Chine et le Népal ont annoncé conjointement une nouvelle mesure de l'altitude de l'Everest : 8 848,86 mètres.
      Le sommet se trouve dans l'Himalaya, à la frontière entre le Népal et la Chine.
    extracts:
      - affirmation: L'altitude de l'Everest annoncée en 2020 est de 8 848,86 mètres.
        citation: "En 2020, la Chine et le Népal ont annoncé conjointement une nouvelle mesure de l'altitude de l'Everest : 8 848,86 mètres"
      - affirmation: L'Everest se trouve dans l'Himalaya.
        citation: Le sommet se trouve dans l'Himalaya

  - url: https://geographie.example/pays/australie
    title: L'Australie — fiche pays
    published: "2025-03-17"
    text: |
      La capitale de l'Australie est Canberra, et non Sydney, la ville la plus peuplée du pays.
      Canberra a été choisie comme compromis entre Sydney et Melbourne ; le Parlement y siège depuis 1927.
    extracts:
