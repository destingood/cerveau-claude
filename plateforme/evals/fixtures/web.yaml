  - url: https://energie.example/chauffage/pompe-a-chaleur
    title: La pompe à chaleur air-eau
    published: "2025-09-12"
    text: |
      Une pompe à chaleur prélève des calories dans l'air extérieur pour chauffer le logement.
      Son coefficient de performance est souvent compris entre 3 et 4 : elle restitue plusieurs kilowattheures de chaleur pour un kilowattheure d'électricité consommé.
      Son rendement baisse lorsque les températures extérieures sont très basses, et son prix d'achat est plus élevé que celui d'une chaudière.
    extracts:
      - affirmation: Une pompe à chaleur restitue plusieurs kWh de chaleur par kWh d'électricité.
        citation: elle restitue plusieurs kilowattheures de chaleur pour un kilowattheure d'électricité consommé
      - affirmation: Son rendement baisse par grand froid et son prix d'achat est plus élevé.
        citation: Son rendement baisse lorsque les températures extérieures sont très basses, et son prix d'achat est plus élevé que celui d'une chaudière

  - url: https://habitat.example/chauffage/chaudiere-gaz
    title: La chaudière à gaz à condensation
    published: "2025-05-21"
    text: |
      La chaudière à gaz à condensation coûte moins cher à l'achat qu'une pompe à chaleur et fonctionne quelle que soit la température extérieure.
      Elle brûle un combustible fossile et émet donc du dioxyde de carbone, et son coût d'usage dépend du prix du gaz.
    extracts:
      - affirmation: La chaudière gaz coûte moins cher à l'achat et fonctionne par tous les temps.
        citation: La chaudière à gaz à condensation coûte moins cher à l'achat qu'une pompe à chaleur et fonctionne quelle que soit la température extérieure
      - affirmation: Elle émet du dioxyde de carbone et dépend du prix du gaz.
        citation: Elle brûle un combustible fossile et émet donc du dioxyde de carbone, et son coût d'usage dépend du prix du gaz

  - url: https://energie.example/electricite/nucleaire
    title: L'électricité nucléaire
    published: "2025-02-26"
    text: |
      Les centrales nucléaires produisent une électricité peu émettrice de dioxyde de carbone pendant leur fonctionnement.
      Leur production est pilotable : elle ne dépend ni du vent ni de l'ensoleillement.
    extracts:
      - affirmation: Le nucléaire produit une électricité peu émettrice de CO2 en fonctionnement.
        citation: Les centrales nucléaires produisent une électricité peu émettrice de dioxyde de carbone pendant leur fonctionnement
      - affirmation: Sa production est pilotable.
        citation: "Leur production est pilotable : elle ne dépend ni du vent ni de l'ensoleillement"

  - url: https://environnement.example/dossiers/limites-du-nucleaire
    title: Les limites de l'énergie nucléaire
    published: "2025-06-14"
    text: |
      Le nucléaire produit des déchets radioactifs dont certains restent dangereux pendant des milliers d'années.
      La construction de nouveaux réacteurs est longue et coûteuse, et les chantiers récents ont connu d'importants retards.
    extracts:
      - affirmation: Le nucléaire produit des déchets radioactifs à très longue durée de vie.
        citation: Le nucléaire produit des déchets radioactifs dont certains restent dangereux pendant des milliers d'années
      - affirmation: La construction de réacteurs est longue, coûteuse et sujette aux retards.
        citation: La construction de nouveaux réacteurs est longue et coûteuse, et les chantiers récents ont connu d'importants retards

