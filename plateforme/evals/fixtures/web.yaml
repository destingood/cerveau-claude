    title: Comment se forme le prix des carburants
    published: "2025-10-01"
    text: |
      Le prix à la pompe dépend du cours du pétrole brut, du taux de change, des marges de raffinage et de distribution, et des taxes.
      Ces éléments varient d'une semaine à l'autre ; aucun organisme ne publie de prix garanti pour les années à venir.

