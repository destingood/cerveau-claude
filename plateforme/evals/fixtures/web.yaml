  - url: https://presse-industrie.example/2026/10/16/acme-industries-recule
    title: Acme Industries recule après son point d'activité
    published: "2026-10-16"
    text: |
      Le titre Acme Industries (fictif) a nettement reculé vendredi 16 octobre 2026, au lendemain de son point d'activité trimestriel.
      Les analystes interrogés soulignent la dépendance du groupe au cycle industriel européen.
      Un ralentissement prolongé de la production manufacturière en Europe est le principal risque cité.
      À l'inverse, une reprise des investissements d'automatisation soutiendrait le carnet de commandes.
    extracts:
      - affirmation: Le titre Acme Industries a nettement reculé le vendredi 16 octobre 2026.
        citation: a nettement reculé vendredi 16 octobre 2026
      - affirmation: Le principal risque cité est un ralentissement prolongé de la production manufacturière en Europe.
        citation: Un ralentissement prolongé de la production manufacturière en Europe est le principal risque cité
      - affirmation: Une reprise des investissements d'automatisation soutiendrait le carnet de commandes.
        citation: une reprise des investissements d'automatisation soutiendrait le carnet de commandes

