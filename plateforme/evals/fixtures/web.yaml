      - affirmation: L'éteindre la nuit réduit un peu la facture.
        citation: L'éteindre la nuit réduit un peu la facture d'électricité

  - url: https://reseaux.example/conseils/redemarrer-sa-box
    title: Faut-il redémarrer sa box tous les jours ?
    published: "2025-02-15"
    text: |
      Les opérateurs installent souvent les mises à jour de la box pendant la nuit.
      Une box éteinte la nuit ne reçoit pas ces mises à jour et coupe aussi la téléphonie par internet.
    extracts:
