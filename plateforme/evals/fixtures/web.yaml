  - url: https://securite.example/guides/double-authentification
    title: Activer la double authentification
    published: "2025-05-05"
    text: |
      La double authentification ajoute une seconde preuve d'identité au mot de passe, par exemple un code temporaire généré par une application.
      Elle protège le compte même si le mot de passe a fuité ; il est conseillé de conserver les codes de secours dans un endroit sûr.
    extracts:
      - affirmation: La double authentification ajoute une seconde preuve d'identité au mot de passe.
        citation: La double authentification ajoute une seconde preuve d'identité au mot de passe
      - affirmation: Elle protège le compte même si le mot de passe a fuité.
        citation: Elle protège le compte même si le mot de passe a fuité

