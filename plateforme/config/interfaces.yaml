# Interfaces de supervision (phase 5 : ADR-037, ADR-038, ADR-041). Seul l'utilisateur lance l'API et le
# bot (D22) ; Claude Code ne se connecte ni à Discord ni à ntfy.
# Les secrets vivent dans l'environnement du compte de service qui lance le bot et l'API
# (docs/procedure-live.md, prérequis 5), jamais ici (R6) ni en variables du compte où tourne
# Claude Code : DISCORD_BOT_TOKEN, CERVEAU_API_TOKEN, CERVEAU_TOTP_SECRET, NTFY_TOKEN et NTFY_TOPIC
# (au moins 32 caractères aléatoires : sur ntfy.sh, le sujet vaut un mot de passe). Claude Code
# n'en lit jamais la valeur (hook guard_shell) et son environnement masque les trois premiers
# (clé env de .claude/settings.json) ; la paire ntfy y reste, pour qu'une alerte parte (B228).
discord:
  owner_user_id: A_DEFINIR   # identifiant numérique du compte Discord de l'utilisateur, entre guillemets
api:
  host: 127.0.0.1            # boucle locale seule (D16)
  # Port local de l'API et du dashboard (1024 à 65535). Étape B3 du plan, proposé par Claude, à
  # valider dans la PR : 8427, absent des ports du dépôt (3000, 5432, 8001, 9090) et des serveurs de
  # développement courants (8000, 8080, 8787). Le registre de l'IANA n'a pas pu être lu depuis la
  # session : un port déjà pris empêche seulement l'API de démarrer. Seul toi la lances (D22).
  port: 8427
ntfy:
  server: A_DEFINIR          # URL https du serveur, sans barre finale (ntfy.sh jusqu'au VPS, D14)
  timeout_seconds: 3         # un envoi ne bloque jamais un arrêt (ADR-038)
