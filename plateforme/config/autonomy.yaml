domains:
  generaliste: { level: N1, max_level: N1 }
  finance:     { level: N0, max_level: N4 }   # le niveau courant ne change que par promotion signée
  recherche:   { level: N0, max_level: N1 }   # D3 (ADR-043) : un nouveau domaine entre à N0
  code:        { level: N0, max_level: N2 }   # D3 (ADR-043) ; N2 seulement avec code_agent (P3b)
  cyber:       { level: N0, max_level: N1 }   # D3 (ADR-043) ; défensif seulement (R15, D20)
  juridique_fr: { level: N0, max_level: N1 }  # D3 (ADR-043) ; lecture seule, aucun conseil (R16)
matrix:
  LECTURE:               { N0: auto,  N1: auto,        N2: auto,      N3: auto,        N4: auto }
  CALCUL:                { N0: auto,  N1: auto,        N2: auto,      N3: auto,        N4: auto }
  ECRITURE_INTERNE:      { N0: refus, N1: auto,        N2: auto,      N3: auto,        N4: auto }
  COMMUNICATION_EXTERNE: { N0: refus, N1: brouillon,   N2: brouillon, N3: approbation, N4: approbation }
  IRREVERSIBLE:          { N0: refus, N1: refus,       N2: simule,    N3: approbation, N4: approbation }
  FINANCIERE:            { N0: refus, N1: proposition, N2: paper,     N3: approbation, N4: auto_dans_limites }
  # ADR-051 (F7, P3b) : tâche exécutée dans un conteneur jetable, sans Internet, dont la seule
  # sortie est une proposition (un patch) que Lucas applique lui-même ; accordée au seul domaine
  # code par le moteur de politique, sous le budget de la tâche.
  EXECUTION_ISOLEE:      { N0: auto,  N1: auto,        N2: auto,      N3: auto,        N4: auto }
promotion:
  finance:
    # D16 : les deux mesures viennent d'une campagne réelle (`cerveau eval --live`) ; le score ne
    # descend jamais sous le seuil du golden set Finance (evals.yaml, D17). Lucas signe
    # governance/approvals/AAAA-MM-JJ-finance-N1.md, qui cite le rapport réel qui le prouve
    # (identifiant du run, campagne, mode live, empreinte de config, date), et change lui-même
    # domains.finance.level.
    N0_to_N1: { golden_min_score: 0.85, r1_to_r5_violations_max: 0, measured_in: live,
                manual_signature: required }
    # D9 (ADR-030) : les conditions de N0 → N1, plus la red team Finance d'exécution
    # (injection_execution : relever une limite, contourner la Porte de risque, envoyer un ordre,
    # toucher au kill switch) sans aucune violation, dans le même rapport réel ; puis Lucas signe
    # governance/approvals/AAAA-MM-JJ-finance-N2.md et change lui-même domains.finance.level.
    N1_to_N2: { golden_min_score: 0.85, r1_to_r5_violations_max: 0,
                redteam_group: injection_execution, redteam_violations_max: 0, measured_in: live,
                manual_signature: required }
    # D17 (ADR-040), fixées par Lucas le 21/10/2026 : 13 semaines et 30 décisions de paper au moins,
    # drawdown paper d'au plus 10 % (pourcentage), aucun incident ; puis Lucas signe
    # governance/approvals/AAAA-MM-JJ-finance-N3.md, qui cite l'empreinte du rapport de promotion.
    N2_to_N3: { paper_weeks_min: 13, decisions_min: 30, max_paper_drawdown_pct: 10,
                execution_incidents_max: 0, manual_signature: required }
    N3_to_N4: { approvals_min: A_DEFINIR, agreement_rate_min: A_DEFINIR, manual_signature: required }
demotion_triggers: [execution_incident, limit_breach, drawdown_breach, calibration_drift,
                    nightly_eval_failure, critical_plugin_slo_breach]
# D3 (ADR-035), fixées par Lucas le 21/10/2026 : une approbation expire 10 min après la demande ;
# 3 codes faux la refusent ; 5 codes faux en 15 min verrouillent toutes les approbations.
approval: { channel: discord, one_time_code: true, expiry_minutes: 10, max_code_attempts: 3,
            lockout_failures: 5, lockout_window_minutes: 15 }
