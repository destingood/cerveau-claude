# Prix publics en USD par million de tokens (MTok), relevés à la main (ADR-005, R1).
# Un prix inconnu reçoit le marqueur « à vérifier » et bloque le calcul de coût (R7).
# Routage global (par défaut) : inference_geo n'est pas utilisé (« us » multiplierait par 1,1).
anthropic:
  source: "https://platform.claude.com/docs/en/about-claude/pricing"
  verified_on: 2026-10-18
  models:
    claude-opus-5-5:
      tiers:
        - { input: "4", cache_write_5m: "5", cache_write_1h: "8", cache_read: "0.20", output: "20" }
    claude-sonnet-5-5:
      tiers:
        - { input: "2", cache_write_5m: "2.50", cache_write_1h: "4", cache_read: "0.10", output: "10" }
    claude-haiku-5-5:
      # Prix selon la longueur du prompt (entrée + écritures et lectures de cache).
      tiers:
        - { max_prompt_tokens: 100000, input: "0.10", cache_write_5m: "0.125", cache_write_1h: "0.20", cache_read: "0.01", output: "0.50" }
        - { input: "0.50", cache_write_5m: "0.625", cache_write_1h: "1", cache_read: "0.05", output: "2.50" }
search:
  brave:
    # Le crédit gratuit mensuel n'est pas déduit : le coût compté est le coût plein (prudence).
    usd_per_1000_requests: "5"
    source: "https://brave.com/search/api"
    verified_on: 2026-10-18
fx:
  # Taux de référence BCE, fixe et daté (D5) ; mis à jour à la main.
  usd_per_eur: "1.1253"
  rate_date: 2026-10-16
  source: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
  read_on: 2026-10-18
