# Paramètres de risque opérationnel cités dans le corps du méga-prompt (sections 3, 6.5, 8.5, 8.6, 13)
# et absents de l'Annexe B. Regroupés ici pour respecter R7 : une valeur inconnue bloque la fonction.
kill_switch:
  target_seconds: 5                      # R4, ADR-034 : fixée par l'utilisateur le 20/10/2026 (D11)
  data_loss_timeout_seconds: A_DEFINIR   # 8.5 : perte de connexion aux données
plugin_health:
  slo_breach_days_before_disable: A_DEFINIR   # 6.5 : défaut documenté 2 jours
keys:
  rotation_days: A_DEFINIR               # 8.6
infra:
  private_network: A_DEFINIR             # 13 : réseau privé de type WireGuard

# Risque de marché du pack Finance (ADR-014), validé par l'utilisateur le 2026-10-18 (D7, D8, D10, D11).
# Les changer relance les évals (R9) ; les tolérances du recoupement ne s'assouplissent jamais.
market_risk:
  var:
    confidence_levels: [0.95, 0.99]
    horizons_sessions: [1, 10]        # h > 1 : mise à l'échelle racine de h, [Approximation]
    window_sessions: 500
    monte_carlo_draws: 10000
    seed: 2026
  backtest:                           # Kupiec, rapport de vraisemblance sur la couverture
    window_sessions: 250
    significance: 0.05
  annualisation_sessions: 252
  risk_free: estr
  benchmark:
    description: ETF MSCI World en EUR, dividendes réinvestis
    isin: A_VERIFIER
  hypothetical_stress:                # §10.4
    rates_bp: 100
    equity_shock: -0.20
    fx_eurusd_shocks: [-0.10, 0.10]
  historical_stress:                  # D10 : dates relevées avec leur source avant usage
    crise_2008:  { label: "Crise financière (faillite de Lehman)", start: A_VERIFIER, end: A_VERIFIER, source: A_VERIFIER }
    covid_2020:  { label: "Krach du Covid", start: A_VERIFIER, end: A_VERIFIER, source: A_VERIFIER }
    taux_2022:   { label: "Hausse des taux", start: A_VERIFIER, end: A_VERIFIER, source: A_VERIFIER }
  cross_check:                        # D11
    rel_tolerance: 1.0e-9
    monte_carlo_rel_tolerance: 0.02
    monte_carlo_draws: 100000

# Frais et glissement (R10, D13) : ceux du courtier de l'utilisateur. Tant qu'ils manquent, une
# proposition d'optimisation donne les poids cibles mais aucune liste d'opérations (R7).
trading_costs:
  commission_pct: A_DEFINIR       # en % du montant de l'ordre : 0.1 pour 0,1 %
  min_commission_eur: A_DEFINIR   # par ordre
  slippage_bps: A_DEFINIR
  fx_conversion_bps: A_DEFINIR    # change d'un ordre en devise étrangère

# Optimisation de portefeuille (F4, ADR-019). Positions longues seulement, sans levier
# (risk_limits.paper : allow). La moyenne-variance maximise rendement - aversion x variance, sur
# la moyenne historique, qui n'est pas une prévision : l'aversion au risque est une décision de
# l'utilisateur ; tant qu'elle manque, la méthode est bloquée (R7).
optimization:
  covariance: ledoit_wolf
  risk_aversion: A_DEFINIR
