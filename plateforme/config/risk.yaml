# Paramètres de risque opérationnel cités dans le corps du méga-prompt (sections 3, 6.5, 8.5, 8.6, 13)
# et absents de l'Annexe B. Regroupés ici pour respecter R7 : une valeur inconnue bloque la fonction.
kill_switch:
  target_seconds: 5                      # R4, ADR-034 : fixée par l'utilisateur le 20/10/2026 (D11)
  # 8.5, ADR-034. Étape B3 du plan (27/11/2026), proposé par Claude, à valider dans la PR : 30 s, la
  # moitié des 60 s proposées le 17/11 (docs/archive/plans/etape-1-reglages.md). Prudent : le kill
  # switch s'engage plus tôt ; un faux départ ne fait qu'arrêter (réarmement par toi seul). Aucune
  # connexion continue n'existe encore (D11) : la valeur ne sert qu'à son arrivée, à revoir alors.
  data_loss_timeout_seconds: 30
plugin_health:
  # 6.5 (défaut documenté : 2 jours). Étape B3 : 1, le plus court possible. Prudent : un plugin hors
  # SLO sort dès le premier jour (une fonction coupée plutôt qu'un plugin défaillant). Rien ne le
  # désactive encore : les SLO des plugins ne sont pas fixés (B349).
  slo_breach_days_before_disable: 1
keys:
  # 8.6. Étape B3 : 90 jours, la durée maximale du contrôle « clés d'accès tournées tous les 90 jours
  # ou moins » du CIS AWS Foundations Benchmark (repris par AWS Security Hub, contrôle IAM.3, lu le
  # 27/11/2026). Prudent face à « jamais » ; plus court, aucune source, et c'est toi qui tournes les
  # clés à la main. Aucun rappel n'est encore branché.
  rotation_days: 90
infra:
  private_network: A_DEFINIR             # 13 : réseau privé de type WireGuard

# Risque de marché du pack Finance (ADR-014), validé par l'utilisateur le 2026-10-18 (D7, D8, D10, D11).
# Les changer relance les évals (R9) ; les tolérances du recoupement ne s'assouplissent jamais.
market_risk:
  var:
    confidence_levels: [0.95, 0.99]
    horizons_sessions: [1, 10]        # h > 1 : mise à l'échelle racine de h, [Approximation]
    window_sessions: 500
    monte_carlo_draws: 10000
    seed: 2026
  backtest:                           # Kupiec, rapport de vraisemblance sur la couverture
    window_sessions: 250
    significance: 0.05
  annualisation_sessions: 252
  risk_free: estr
  benchmark:
    description: ETF MSCI World en EUR, dividendes réinvestis
    isin: A_VERIFIER
  hypothetical_stress:                # §10.4
    rates_bp: 100
    equity_shock: -0.20
    fx_eurusd_shocks: [-0.10, 0.10]
  historical_stress:                  # D10 : dates relevées avec leur source ; choisies par l'utilisateur le 27/11 (étape B3)
    crise_2008:  { label: "Crise financière (faillite de Lehman)", start: 2008-09-12, end: 2009-03-09, source: "faillite le 15/09/2008 (Form 8-K, sec.gov) ; creux du MSCI World le 09/03/2009 (fiche MSCI World Index, msci.com, 30/10/2026), lus le 2026-11-27" }
    covid_2020:  { label: "Krach du Covid", start: 2020-02-19, end: 2020-03-23, source: "perte maximale du MSCI World (EUR, net), fiche MSCI du 30/10/2026, lue le 2026-11-27" }
    taux_2022:   { label: "Hausse des taux", start: 2022-07-27, end: 2023-09-20, source: "hausses des taux directeurs BCE, dates d'effet (ecb.europa.eu, key_ecb_interest_rates), lues le 2026-11-27" }
  cross_check:                        # D11
    rel_tolerance: 1.0e-9
    monte_carlo_rel_tolerance: 0.02
    monte_carlo_draws: 100000

# Frais et glissement (R10, D13) : ceux du courtier de l'utilisateur. Tant qu'ils manquent, une
# proposition d'optimisation donne les poids cibles mais aucune liste d'opérations (R7).
trading_costs:
  commission_pct: A_DEFINIR       # en % du montant de l'ordre : 0.1 pour 0,1 %
  min_commission_eur: A_DEFINIR   # par ordre
  slippage_bps: A_DEFINIR
  fx_conversion_bps: A_DEFINIR    # change d'un ordre en devise étrangère

# Optimisation de portefeuille (F4, ADR-019). Positions longues seulement, sans levier
# (risk_limits.paper : allow). La moyenne-variance maximise rendement - aversion x variance, sur
# la moyenne historique, qui n'est pas une prévision : l'aversion au risque est une décision de
# l'utilisateur ; tant qu'elle manque, la méthode est bloquée (R7).
optimization:
  covariance: ledoit_wolf
  risk_aversion: A_DEFINIR
