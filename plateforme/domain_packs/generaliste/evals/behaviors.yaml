  - id: pack-photographie-absent
    description: une question de photographie, domaine sans pack
    question: Qu'est-ce que l'ouverture d'un objectif photo ?
    pages:
      - url: https://photo-pratique.example/bases/ouverture
        title: Comprendre l'ouverture
        published: "2025-04-09"
        text: |
          L'ouverture désigne le diamètre du diaphragme de l'objectif, qui règle la quantité de lumière reçue par le capteur.
          Une grande ouverture réduit aussi la profondeur de champ.
        extracts:
          - affirmation: L'ouverture règle la quantité de lumière reçue par le capteur.
            citation: règle la quantité de lumière reçue par le capteur
