    description: une question de musique, sans pack musique
    question: Pourquoi une gamme majeure compte-t-elle sept notes ?
    pages:
      - url: https://solfege-pratique.example/gammes/gamme-majeure
        title: La gamme majeure
        published: "2025-04-17"
        text: |
          La gamme majeure suit une succession fixe de tons et de demi-tons, qui donne sept degrés avant le retour à l'octave.
          Chaque degré porte un nom et une fonction dans l'harmonie tonale.
        extracts:
          - affirmation: La gamme majeure compte sept degrés, selon une succession fixe de tons et de demi-tons.
            citation: La gamme majeure suit une succession fixe de tons et de demi-tons, qui donne sept degrés
