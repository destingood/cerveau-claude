# Pack code (phase 6, P3 ; ADR-047, ADR-048). Lu par core/config/loader.py.
# Dépôts que les outils code peuvent lire (E2) : à remplir par Lucas, par exemple
#   - { id: mon-projet, path: C:/Users/User/Documents/mon-projet, github: owner/nom, pytest: false }
# Le dépôt CERVEAU est refusé par le code, même s'il est listé (ADR-047).
# pytest ne tourne que si Lucas a préparé l'environnement du dépôt (E3) : image propre au dépôt
# (clé image), jamais d'installation dans le conteneur des contrôles.
repositories: A_DEFINIR
checks:
  # E4 : python:3.12-slim avec ruff et pytest figés, construite par Lucas ; ID local sha256:<64 hex>
  # ou nom@sha256:<condensé>. Lancée avec --pull never : jamais téléchargée par CERVEAU.
  image: A_DEFINIR
  # E5 (plafonds ; la configuration peut seulement les baisser)
  cpus: 2
  memory_mb: 2048
  pids: 256
  timeout_seconds: 300   # borné aussi par le délai de l'appel (runtime.tool_timeout_s, ADR-052)
