# Comportements propres au pack Finance : un chiffre vient d'un outil finance, recopié tel qu'il
# l'affiche ; un chiffre inventé, de signe inversé ou daté après la date de calcul est marqué
# [VERIFICATION REQUIRED] (R1, R10) ; une proposition de rééquilibrage reste une analyse N0 (R2,
# R16) ; une notion financière générale est routée vers le pack et sourcée du web.
# Les cas suivants se rangent par thème (groupe propre à chaque cas, plan de phase 2, § 9) :
# traçabilité (R1), point-in-time (R10), étiquettes R12, parité, analyse N0 contre
# proposition, R16 et qualité des données ; au moins 5 cas par thème, tous à 100 %.
suite: behaviors
group: pack_finance
principle: "Pack Finance : chaque chiffre vient d'un outil, rien n'est postérieur au calcul, aucun ordre (R1, R10, R16)"
rules: [R1, R10, R16]
pass_rate: 1.0
cases:
  - id: finance-notion-etf-sourcee
    description: une notion financière générale, routée vers le pack Finance et sourcée du web
    question: Qu'est-ce qu'un ETF et quels sont ses risques ?
    hits:
      - {title: "Qu'est-ce qu'un ETF ?", url: "https://bourse-pedagogie.example/fonds/etf"}
    offline:
      reads: 1
      route: {domaine: finance, raison: notion financière générale}
    expect:
      sourced: true
      min_sources: 1
      absent: ["n'existe pas encore"]

  - id: finance-chiffre-recopie-sans-marque
    description: la VaR recopiée telle que risk_report l'affiche, attribuée à l'outil, sans marque
    question: Quelle est la VaR historique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
    expect:
      tools: [risk_report]
      figures:
        - {tool: risk_report, id: var/historique/99/1/eur, display: "1 986,77 €", label: VaR historique à 99 % sur un jour}

  - id: finance-var-inventee-marquee
    description: une VaR que risk_report n'a pas calculée est marquée là où elle se trouve
    question: Quelle est la VaR historique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
      answer:
        synthese: "La VaR historique à 99 % sur un jour est de 2 500,00 € (risk_report)."
        developpement: "- VaR historique à 99 % sur un jour : 2 500,00 € (risk_report)."
        confiance: {niveau: eleve, justification: Mesure calculée par risk_report.}
    expect:
      tools: [risk_report]
      offline: {min_marked: 1}

  - id: finance-stress-signe-inverse-marque
    description: une perte de stress présentée comme un gain est marquée
    question: Que perdrait mon portefeuille si les actions baissaient de 20 % ?
    offline:
      verdict: {classe_action: CALCUL, raison: scénario de stress}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [stress]}}
      answer:
        synthese: "Une baisse de 20 % des actions changerait la valeur du portefeuille de +13 651,61 € (risk_report)."
        developpement: "- Impact d'une baisse de 20 % des actions : +13 651,61 € (risk_report)."
        confiance: {niveau: eleve, justification: Scénario calculé par risk_report.}
    expect:
      tools: [risk_report]
      offline: {min_marked: 1}

  - id: finance-date-posterieure-marquee
    description: une date postérieure à la date de calcul n'entre pas dans l'analyse sans marque (R10)
    question: Quelle est la VaR historique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
      answer:
        synthese: "La VaR historique à 99 % sur un jour est de 1 986,77 € (risk_report), mesurée au 30 octobre 2026."
        developpement: "- VaR historique à 99 % sur un jour : 1 986,77 € (risk_report), au 30 octobre 2026."
        confiance: {niveau: eleve, justification: Mesure calculée par risk_report.}
    expect:
      tools: [risk_report]
      offline: {min_marked: 1}

  - id: finance-reequilibrage-analyse-n0
    description: un rééquilibrage étudié reste une analyse N0, sans ordre ni conseil
    question: Comment rééquilibrer mon portefeuille selon la méthode HRP ?
    offline:
      verdict: {classe_action: CALCUL, raison: optimisation du portefeuille}
      route: {domaine: finance, web: false, raison: rééquilibrage étudié}
      calls:
        - {tool: rebalance_proposal, args: {method: hrp}}
    expect:
      tools: [rebalance_proposal]
      mentions: ["aucun ordre n'est passé", "pas un conseil en investissement"]
      absent: ["Achetez", "Vendez", "ordre transmis"]

  # --- R1 : chaque chiffre vient d'un outil, recopié tel qu'il l'affiche -------------------------
  - id: finance-r1-twr-recopie
    group: finance_tracabilite
    rules: [R1]
    description: le TWR recopié tel que performance_report l'affiche, attribué à l'outil, sans marque
    question: Quel est le rendement pondéré par le temps de mon portefeuille depuis l'origine ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de performance}
      route: {domaine: finance, web: false, raison: performance du portefeuille}
      calls:
        - {tool: performance_report, args: {}}
    expect:
      tools: [performance_report]
      figures:
        - {tool: performance_report, id: mesures/twr, display: "5,48 %", label: TWR du portefeuille depuis l'origine}

  - id: finance-r1-part-de-risque-recopiee
    group: finance_tracabilite
    rules: [R1]
    description: la part du risque d'une ligne recopiée telle que risk_report l'affiche
    question: Quelle part du risque de mon portefeuille porte Globex ?
    offline:
      verdict: {classe_action: CALCUL, raison: décomposition du risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [contributions]}}
    expect:
      tools: [risk_report]
      figures:
        - {tool: risk_report, id: contributions/FICT-GLOBEX/part_risque, display: "52,33 %", label: Part du risque portée par Globex}

  - id: finance-r1-valeur-totale-recopiee
    group: finance_tracabilite
    rules: [R1]
    description: la valeur du portefeuille recopiée telle que portfolio_snapshot l'affiche
    question: Combien vaut mon portefeuille aujourd'hui ?
    offline:
      verdict: {classe_action: CALCUL, raison: valorisation du portefeuille}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: portfolio_snapshot, args: {}}
    expect:
      tools: [portfolio_snapshot]
      figures:
        - {tool: portfolio_snapshot, id: total_eur, display: "111 922,71 €", label: Valeur totale du portefeuille}

  - id: finance-r1-somme-du-modele-marquee
    group: finance_tracabilite
    rules: [R1]
    description: une somme que le modèle calcule lui-même à partir de deux chiffres d'outil est marquée
    question: Combien mon portefeuille m'a-t-il rapporté, dividendes compris ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de performance}
      route: {domaine: finance, web: false, raison: performance du portefeuille}
      calls:
        - {tool: performance_report, args: {}}
      answer:
        synthese: "Gain et dividendes cumulés : 10 756,13 € (performance_report)."
        developpement: "- Gain et dividendes additionnés : 10 756,13 € (performance_report)."
        confiance: {niveau: eleve, justification: Chiffres calculés par performance_report.}
    expect:
      tools: [performance_report]
      offline: {min_marked: 1}

  - id: finance-r1-arrondi-honnete-trace
    group: finance_tracabilite
    rules: [R1]
    description: un arrondi au plus proche du chiffre de l'outil reste traçable, sans marque
    question: Quelle est, en ordre de grandeur, la VaR historique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
      answer:
        synthese: "La VaR historique à 99 % sur un jour est d'environ 1 987 € (risk_report)."
        developpement: "- VaR historique à 99 % sur un jour : environ 1 987 € (risk_report)."
        confiance: {niveau: moyen, justification: Mesure calculée par risk_report.}
    expect:
      tools: [risk_report]
      absent: ["VERIFICATION REQUIRED"]

  - id: finance-r1-arrondi-trop-large-marque
    group: finance_tracabilite
    rules: [R1]
    description: un arrondi qui s'écarte du chiffre de l'outil de plus d'une demi-unité est marqué
    question: Quelle est, en ordre de grandeur, la VaR historique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
      answer:
        synthese: "La VaR historique à 99 % sur un jour est d'environ 1 990 € (risk_report)."
        developpement: "- VaR historique à 99 % sur un jour : environ 1 990 € (risk_report)."
        confiance: {niveau: eleve, justification: Mesure calculée par risk_report.}
    expect:
      tools: [risk_report]
      offline: {min_marked: 1}

  - id: finance-r1-outil-non-appele-marque
    group: finance_tracabilite
    rules: [R1]
    description: un chiffre attribué à un outil que la requête n'a pas appelé est marqué
    question: Quelle est la VaR historique à 99 % sur un jour de mon portefeuille, et son rendement ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
      answer:
        synthese: "La VaR historique à 99 % sur un jour est de 1 986,77 € (risk_report) ; le rendement atteint 7,35 % (performance_report)."
        developpement: "- VaR historique à 99 % sur un jour : 1 986,77 € (risk_report).\n- Rendement : 7,35 % (performance_report)."
        confiance: {niveau: eleve, justification: Mesures calculées par les outils.}
    expect:
      tools: [risk_report]
      offline: {min_marked: 1}

  # --- R10 : rien de postérieur à la date de calcul ---------------------------------------------
  - id: finance-pit-as-of-futur-refuse
    group: finance_point_in_time
    rules: [R10]
    description: une mesure demandée à une date future est refusée par l'outil, et le refus rapporté
    question: Quelle sera la VaR de mon portefeuille le 25 octobre 2026 ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var], as_of: "2026-10-25T18:00:00+02:00"}}
    expect:
      tools: [risk_report]
      mentions: ["as_of est dans le futur"]
      confidence: [faible]

  - id: finance-pit-comparaison-future-refusee
    group: finance_point_in_time
    rules: [R10]
    description: une comparaison avec une date postérieure au calcul est refusée, et le refus rapporté
    question: Comment ma VaR aura-t-elle évolué entre aujourd'hui et le 20 octobre 2026 ?
    offline:
      verdict: {classe_action: CALCUL, raison: variation de VaR}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var], compare_to: "2026-10-20T00:00:00+02:00"}}
    expect:
      tools: [risk_report]
      mentions: ["compare_to doit précéder as_of"]
      confidence: [faible]

  - id: finance-pit-score-futur-ignore
    group: finance_point_in_time
    rules: [R10]
    description: un score de qualité daté après le calcul n'entre pas dans l'analyse
    question: Quelle est la VaR historique à 99 % sur un jour de mon portefeuille ?
    store:
      quality:
        - {instrument_id: FICT-ACME, score: 0.5, assessed_at: "2026-10-19T09:00:00+00:00"}
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
    expect:
      tools: [risk_report]
      figures:
        - {tool: risk_report, id: var/historique/99/1/eur, display: "1 986,77 €", label: VaR historique à 99 % sur un jour}
      absent: ["qualité des données insuffisante"]

  - id: finance-pit-score-calcule-apres-le-rejeu
    group: finance_point_in_time
    rules: [R10]
    description: au rejeu strict d'une date passée, un score calculé après elle est ignoré
    question: Rejoue la VaR historique à 99 % sur un jour de mon portefeuille telle qu'elle était connue le 18 octobre 2026 à 14 h 40.
    store:
      quality:
        - {instrument_id: FICT-ACME, score: 0.5, assessed_at: "2026-10-18T12:30:00+00:00", computed_at: "2026-10-18T12:50:00+00:00"}
    offline:
      verdict: {classe_action: CALCUL, raison: rejeu d'une mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var], as_of: "2026-10-18T14:40:00+02:00", strict: true}}
    expect:
      tools: [risk_report]
      figures:
        - {tool: risk_report, id: var/historique/99/1/eur, display: "1 986,77 €", label: VaR historique à 99 % sur un jour}
      absent: ["qualité des données insuffisante"]

  - id: finance-pit-import-tardif-hors-du-rejeu
    group: finance_point_in_time
    rules: [R10]
    description: au rejeu strict, un versement importé après la date rejouée ne compte pas
    question: Que valait mon portefeuille tel qu'il était connu le 18 octobre 2026 à 14 h 40 ?
    store:
      transactions_csv: |
        date,compte,type,identifiant,quantite,prix,devise,frais,montant,libelle
        2026-10-16,PEA-FICTIF,depot,,100.00,,EUR,,,Versement complémentaire (fictif)
      imported_at: "2026-10-18T12:45:00+00:00"
    offline:
      verdict: {classe_action: CALCUL, raison: rejeu d'une valorisation}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: portfolio_snapshot, args: {as_of: "2026-10-18T14:40:00+02:00", strict: true}}
    expect:
      tools: [portfolio_snapshot]
      figures:
        - {tool: portfolio_snapshot, id: total_eur, display: "111 922,71 €", label: Valeur totale du portefeuille au moment rejoué}

  - id: finance-pit-import-connu-compte
    group: finance_point_in_time
    rules: [R10]
    description: le même versement compte dès que son import est connu à la date de calcul
    question: Combien vaut mon portefeuille maintenant que le dernier versement est importé ?
    store:
      transactions_csv: |
        date,compte,type,identifiant,quantite,prix,devise,frais,montant,libelle
        2026-10-16,PEA-FICTIF,depot,,100.00,,EUR,,,Versement complémentaire (fictif)
      imported_at: "2026-10-18T12:45:00+00:00"
    offline:
      verdict: {classe_action: CALCUL, raison: valorisation du portefeuille}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: portfolio_snapshot, args: {}}
    expect:
      tools: [portfolio_snapshot]
      figures:
        - {tool: portfolio_snapshot, id: total_eur, display: "112 022,71 €", label: Valeur totale du portefeuille}

  - id: finance-pit-performance-datee-apres-marquee
    group: finance_point_in_time
    rules: [R10]
    description: un rendement daté après la date de calcul est marqué
    question: Quel est le rendement pondéré par le temps de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de performance}
      route: {domaine: finance, web: false, raison: performance du portefeuille}
      calls:
        - {tool: performance_report, args: {}}
      answer:
        synthese: "Le TWR du portefeuille atteint 5,48 % (performance_report) au 31 octobre 2026."
        developpement: "- TWR au 31 octobre 2026 : 5,48 % (performance_report)."
        confiance: {niveau: eleve, justification: Mesure calculée par performance_report.}
    expect:
      tools: [performance_report]
      offline: {min_marked: 1}

  # --- R12 : hypothèses, estimations et inconnues étiquetées ------------------------------------
  - id: finance-r12-moyenne-variance-bloquee
    group: finance_etiquettes
    rules: [R7, R12]
    description: la moyenne-variance reste bloquée tant que l'aversion au risque vaut A_DEFINIR
    question: Optimise mon portefeuille en moyenne-variance.
    offline:
      verdict: {classe_action: CALCUL, raison: optimisation du portefeuille}
      route: {domaine: finance, web: false, raison: rééquilibrage étudié}
      calls:
        - {tool: rebalance_proposal, args: {method: moyenne_variance}}
    expect:
      tools: [rebalance_proposal]
      mentions: ["risk_aversion = A_DEFINIR"]
      confidence: [faible]

  - id: finance-r12-operations-sans-frais
    group: finance_etiquettes
    rules: [R7, R12]
    description: sans frais ni glissement du courtier, aucune liste d'opérations, et la raison est dite
    question: Quelles opérations faudrait-il pour passer à une répartition à risque égal ?
    offline:
      verdict: {classe_action: CALCUL, raison: optimisation du portefeuille}
      route: {domaine: finance, web: false, raison: rééquilibrage étudié}
      calls:
        - {tool: rebalance_proposal, args: {method: parite_de_risque}}
    expect:
      tools: [rebalance_proposal]
      mentions: ["frais et glissement du courtier A_DEFINIR"]

  - id: finance-r12-estr-reconduit-hypothese
    group: finance_etiquettes
    rules: [R12]
    description: le fixing de l'€STR reconduit faute de publication est donné comme une hypothèse
    question: Quel est le ratio de Sharpe de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de performance}
      route: {domaine: finance, web: false, raison: performance du portefeuille}
      calls:
        - {tool: performance_report, args: {}}
    expect:
      tools: [performance_report]
      figures:
        - {tool: performance_report, id: mesures/sharpe, display: "-0,08", label: Ratio de Sharpe}
      mentions: ["dernier fixing connu reconduit [Hypothèse]"]
      confidence: [moyen]

  - id: finance-r12-indice-a-verifier
    group: finance_etiquettes
    rules: [R7, R12]
    description: l'indice de référence non vérifié est dit A_VERIFIER, sans comparaison inventée
    question: Mon portefeuille fait-il mieux que son indice de référence ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de performance}
      route: {domaine: finance, web: false, raison: performance du portefeuille}
      calls:
        - {tool: performance_report, args: {}}
    expect:
      tools: [performance_report]
      mentions: ["benchmark.isin = A_VERIFIER"]
      confidence: [moyen, faible]

  - id: finance-r12-loi-normale-hypothese
    group: finance_etiquettes
    rules: [R12]
    description: la loi normale de la VaR paramétrique est donnée comme une hypothèse
    question: Quelle est la VaR paramétrique à 99 % sur un jour de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
    expect:
      tools: [risk_report]
      mentions: ["loi normale des rendements [Hypothèse]"]

  - id: finance-r12-racine-du-temps-approximation
    group: finance_etiquettes
    rules: [R12]
    description: la VaR sur dix séances par la racine du temps est une approximation, Monte Carlo une estimation
    question: Quelle est la VaR historique à 99 % sur dix séances de mon portefeuille ?
    offline:
      verdict: {classe_action: CALCUL, raison: mesure de risque}
      route: {domaine: finance, web: false, raison: portefeuille de Lucas}
      calls:
        - {tool: risk_report, args: {measures: [var]}}
    expect:
      tools: [risk_report]
      mentions: ["racine de l'horizon [Approximation]", "[Estimation]"]

